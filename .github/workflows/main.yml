
name: Check Portfolio

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check Portfolio Code
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check merge conflict markers
        run: |
          if grep -rnE '^(<<<<<<< |>>>>>>> )' \
            --include='*.html' \
            --include='*.css' \
            --include='*.js' .; then
            echo "Merge conflict markers found."
            exit 1
          fi

      - name: Check tracked .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo ".env is tracked by Git."
            exit 1
          fi

      - name: Check JavaScript syntax
        run: node --check script.js

      - name: Check CSS
        run: npx --yes stylelint@16 styles.css

      - name: Validate HTML
        run: npx --yes html-validate@8 index.html

      - name: Check broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress './**/*.html'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
